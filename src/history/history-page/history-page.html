<div class="header" *ngIf="accessToken">
    <span class="header-label">ประวัติการใช้งาน</span>
    <span class="sub-content-label">ตรวจสอบประวัติการใช้งานของคุณ</span>
    <div class="content">
        <p-button label="รีเฟรช" [icon]="isLoading ? 'pi pi-spin pi-spinner' : 'pi pi-refresh'"
            (click)="refreshHistory()" [disabled]="isLoading" severity="contrast" class="mb-3">
        </p-button>

        <p-table [value]="historyData" [paginator]="true" [rows]="5" [rowsPerPageOptions]="[5,10,25]"
            responsiveLayout="scroll" class="p-datatable-sm">

            <!-- HEADER -->
            <ng-template pTemplate="header">
                <tr>
                    <th>วันที่</th>
                    <th>เวลา</th>
                    <th>แพลตฟอร์ม</th>
                    <th>ลิงก์</th>
                </tr>
            </ng-template>

            <!-- BODY -->
            <ng-template pTemplate="body" let-row>
                <tr>
                    <td>{{ row.Date | date:'d/M/yyyy' }}</td>
                    <td>{{ row.Time }}</td>
                    <td>{{ row.Platform }}</td>
                    <td>
                        <a *ngIf="row.Url; else noLink" [href]="row.Url" target="_blank" rel="noopener noreferrer"
                            class="text-blue-500 hover:underline">
                            เปิดลิงก์
                        </a>
                        <ng-template #noLink>-</ng-template>
                    </td>
                </tr>
            </ng-template>

            <!-- EMPTY -->
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="4">
                        <div class="flex flex-column align-items-center justify-content-center gap-2 p-4 text-500">
                            <i class="pi pi-inbox text-5xl"></i>
                            <span>ไม่พบข้อมูล</span>
                        </div>
                    </td>
                </tr>
            </ng-template>

        </p-table>
    </div>
</div>

<div class="flex align-items-center justify-content-center min-h-screen overflow-hidden relative px-4 "
    style="background-color: #f8f9fa;" *ngIf="!accessToken">

    <div class="absolute border-round-circle opacity-20"
        style="width: 30rem; height: 30rem; top: -5rem; left: -5rem; background: #3b82f6; filter: blur(80px);">
    </div>
    <div class="absolute border-round-circle opacity-20"
        style="width: 30rem; height: 30rem; bottom: -5rem; right: -5rem; background: #8b5cf6; filter: blur(80px);">
    </div>

    <div class="surface-card p-5 md:p-6 shadow-4 border-round-2xl text-center w-full relative z-1"
        style="max-width: 450px;">

        <div class="inline-flex align-items-center justify-content-center border-circle mb-5 shadow-2"
            style="width: 5rem; height: 5rem; background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);">
            <i class="pi pi-lock text-5xl text-blue-600"></i>
        </div>

        <h1 class="text-900 font-bold text-2xl md:text-3xl mb-3 mt-0">
            กรุณาเข้าสู่ระบบ
        </h1>

        <p class="text-600 line-height-3 text-lg mb-6">
            คุณยังไม่ได้เข้าสู่ระบบ หรือเซสชันของคุณหมดอายุแล้ว<br class="hidden md:inline">
            โปรดลงชื่อเข้าใช้งานเพื่อดำเนินการต่อ
        </p>

        <button
            class="w-full cursor-pointer text-white font-bold text-lg border-none border-round-xl py-3 px-4 shadow-2 transition-all transition-duration-200 hover:shadow-4 flex align-items-center justify-content-center gap-2"
            style="background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%); outline: none;" (click)="goToSignIn()">
            <i class="pi pi-sign-in text-xl"></i>
            <span>ไปที่หน้าเข้าสู่ระบบ</span>
        </button>

        <div class="mt-4">
            <div (click)="goToHome()"
                class="text-600 hover:text-900 transition-colors transition-duration-200 no-underline text-sm font-medium cursor-pointer">
                กลับไปหน้าหลัก
            </div>
        </div>
    </div>

</div>
